[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "Evidence-oriented repository research agent built around a small, testable harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
repopilot = "repopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

